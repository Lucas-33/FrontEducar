# Configuración de Flet para el build del APK.
# Flet lee este archivo desde el directorio de la app (frontend/).

[tool.flet]
org = "com.educar"
product = "educar-para-transformar"
company = "Educar para Transformar"
copyright = "Copyright (C) 2026 by Educar para Transformar"

# Los valores por defecto de Flet usan -Xmx8G para Gradle, demasiado para
# equipos con 8 GB de RAM (el proceso termina killed por OOM).
[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m"
"org.gradle.workers.max" = "4"
"kotlin.daemon.jvmargs" = "-Xmx2G"
