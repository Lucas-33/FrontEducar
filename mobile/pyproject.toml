# Configuración de Flet para el build del APK de la app móvil (familias).

[project]
name = "educar-mobile"
version = "0.1.0"
description = "App móvil para familias - Educar para Transformar"
requires-python = ">=3.10"

[tool.flet]
org = "com.educar"
product = "educar-familias"
company = "Educar para Transformar"
copyright = "Copyright (C) 2026 by Educar para Transformar"

# Memoria acotada para Gradle (equipos con RAM limitada). Misma configuración
# que el APK del frontend: con 4 workers y Kotlin de 2G el OOM killer mata el
# daemon de Gradle en esta máquina (~7.5 GB).
[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError"
# Kotlin daemon: limitar también para no competir por memoria con Gradle.
"kotlin.daemon.jvmargs" = "-Xmx1536m"
# Menos workers en paralelo reduce el pico de memoria del build.
"org.gradle.workers.max" = "2"
