[project]
name = "my-app"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "flet>=0.86.5",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "flet-web>=0.86.5",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.5",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.flet]
org = "com.educar"
product = "educar-para-transformar"
company = "Educar para Transformar"
copyright = "Copyright (C) 2026 by Educar para Transformar"

[tool.flet.app]

path = "src"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint]
ignore = [
    "E501", "F841", "F401", "BLE001", "S110", "DTZ011", "DTZ005",
    "B008", "RUF013", "SIM102", "RUF100", "S112", "PLR1722", "PIE810", "E402"
]